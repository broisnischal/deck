[package]
name = "app"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "deck"
path = "src/main.rs"

[dependencies]
smol_str.workspace = true
term.workspace = true
agent-core.workspace = true
agent-claude.workspace = true
agent-cli.workspace = true
session.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
gpui.workspace = true
# Already built for gpui (same version, its default codecs); used to crop
# attachment thumbnails.
image = "0.25"
wry.workspace = true
raw-window-handle.workspace = true
objc2-app-kit.workspace = true
objc2-quartz-core = "0.3"
objc2-foundation = "0.3"
objc2-core-foundation = "0.3"
objc2-core-graphics = "0.3"
block2 = "0.6"
objc2 = "0.6"
objc2-user-notifications = "0.3"
# Code colouring in chats: bat's grammars, on a pure-Rust regex engine.
syntect = { version = "5.3", default-features = false, features = ["parsing", "regex-fancy"] }
two-face = { version = "0.4", default-features = false, features = ["syntect-fancy"] }
