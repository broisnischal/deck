<!-- {"title": "Your account", "description": "Sign in to see your Deck plan, manage billing, or sign out.", "path": "/account/"} -->
    <header class="page-head">
      <div class="eyebrow left">Account</div>
      <h1>Your account</h1>
    </header>

    <section class="sec" style="padding-top:48px" data-account>
      <div data-state="loading">
        <p class="muted">Loading…</p>
      </div>

      <div data-state="out" hidden>
        <div class="account-card">
          <h2>Sign in to Deck</h2>
          <p>Use the same Google account you use in the Mac app. You'll see your plan and can manage billing here.</p>
          <div class="buttons">
            <button class="btn btn-primary" type="button" data-sign-in>
              <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M21.6 12.2c0-.7-.1-1.4-.2-2H12v3.8h5.4a4.6 4.6 0 0 1-2 3v2.5h3.2c1.9-1.7 3-4.3 3-7.3z"/><path d="M12 22c2.7 0 5-.9 6.6-2.4l-3.2-2.5c-.9.6-2 1-3.4 1a5.9 5.9 0 0 1-5.6-4.1H3.1v2.6A10 10 0 0 0 12 22z" opacity=".8"/><path d="M6.4 14a6 6 0 0 1 0-3.9V7.5H3.1a10 10 0 0 0 0 9z" opacity=".6"/><path d="M12 5.9c1.5 0 2.8.5 3.8 1.5l2.9-2.9A10 10 0 0 0 3.1 7.5l3.3 2.6A5.9 5.9 0 0 1 12 5.9z" opacity=".9"/></svg>
              Continue with Google
            </button>
          </div>
          <p class="error" data-error hidden></p>
        </div>
      </div>

      <div data-state="in" hidden>
        <div class="account-card">
          <div class="who">
            <div class="avatar" data-avatar></div>
            <div><b data-name></b><span class="muted small" data-email></span></div>
          </div>
          <dl class="account-rows">
            <div><dt>Plan</dt><dd data-plan>Checking…</dd></div>
            <div><dt data-renews-label>Renews</dt><dd data-renews>—</dd></div>
          </dl>
          <div class="buttons">
            <button class="btn btn-primary" type="button" data-portal hidden>Manage billing</button>
            <a class="btn btn-primary" href="/subscribe" data-choose hidden>Subscribe</a>
            <a class="btn" href="/download/">Download Deck</a>
            <button class="btn" type="button" data-sign-out>Sign out</button>
          </div>
          <p class="error" data-error hidden></p>
          <p class="muted small" style="margin-top:20px">Manage billing opens Dodo Payments, where you can change your card, see invoices, or cancel.</p>
        </div>
      </div>
    </section>
